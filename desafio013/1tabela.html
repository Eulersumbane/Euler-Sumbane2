<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeira tabela do  Desafio013</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;

        }
        table{
            border: 1px solid black;
            border-collapse: collapse;
            padding-bottom: 2px;
            margin-bottom: 2px;

        }
        td{
            border: 1px solid black;
            padding: 8px;
            margin-bottom: 2px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
            <tr>
             <td colspan="5">A</td>
             <td rowspan="6">B</td>
                                              
            </tr>
            
            <tr>
                <td rowspan="8">C</td>
            </tr>
                
                           
            
        
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>

        </tr>
        <tr>
            <td>J</td>
            <td>k</td>
            <td>L</td>
        </tr>
        <tr>
            <tr>
                <td>M</td>
                <td>K</td>
                <td>R</td>
            </tr>
            <tfoot>
                <td colspan="6">N</td>

            </tfoot>
            
        </tr>

    </table>
</body>
</html>
