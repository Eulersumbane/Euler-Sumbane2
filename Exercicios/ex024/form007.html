<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 7 , textearea, select e detalist </title>
</head>
<body>
    <h1>Formulario 7, textearea, select, detalist</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iest"> Estado</label>
            <select name="estado" id="iest">

                <option valeu="" selected>----Escolha----</option>
                <optgroup label="Regiao A">
                    <option value="SP">Sao Paulo</option>
                    <option value="Mp" >Maputo</option>
                    <option value="Ls">Lisboa</option>
                    <option value="Ger">Alemanha</option>
                    <option value="En">England</option>
                </optgroup>

                <optgroup label="Regiao B">
                    <option value="Sg">Senegal</option>
                    <option value="Tl">Tailandia</option>
                    <option value="Br">Brasil</option>
                    <option value="Eg">Egypt</option>
                </optgroup>
            </select>
            <p>
                <label for="iprof">Profissao</label>
                <input type="text" name="prof" id="iprof" list="lstprof">
                <datalist id="lstprof">
                    <option value="prof">Professor</option>
                    <option value="ADM">Administrador</option>
                    <option value="TI">Enegenheiro de Redes</option>
                    <option value="dev TI">Densevolvedor</option>
                </datalist>
                
            </p>
            <p><label for="imgs">Mensagem:</label></p>
            <textarea name="imsg" id="imsg" cols="30" rows="10"></textarea>
        </p>


        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
