<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 2</title>
</head>
<body>
    <h1>Teste de Formulario </h1>
    <form action="cadastro.php" method="post" autocomplete="off">
        <p>
            <label for="isu">Usuario:</label>
            <input type="text" name="usu" id="isu" required minlength="5" maxlength="15" 
             placeholder="Nome do Usuario" size="10">
        </p>
        <p>
            <label for="isen">Password:</label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" 
             placeholder="coloque uma senha" autocomplete="current-password" size="10">
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
