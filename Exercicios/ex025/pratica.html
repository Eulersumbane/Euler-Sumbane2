<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: aqua;
        
        }
    </style>
</head>
<body>
    <h1>Preenchimento de dados</h1>
   <form action="cadastro.php" method="post" autocomplete="on">
    <p>
        <label for="inome"> Nome :</label>
        <input type="text" name="nome" id="inome" placeholder="nome completo"
         maxlength="10" minlength="2" autocomplete="name" required>

    </p>
    <p>
        <label for="idate"> Data de nascimento :</label>
        <input type="date" name="dia" id="idate" placeholder="dia" required>
    </p>
    <p>
        <label for="imes"> Mes:</label>
        <input type="month" name="mes" id="imes" required >
    </p>
    <p>
        <label for="ihora">Horas:</label>
        <input type="time" name="hora" id="ihora" required>
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>

   </form>
</body>
</html>
