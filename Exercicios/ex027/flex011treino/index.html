<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;


        }
        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 300px;
           
        }
        div#a{
            color: brown;
            flex-basis:150px ;
            flex-grow: 1;
            flex-shrink: 2;
            
            
        }
        div#b{
            color: blueviolet;
            flex-basis:150px ;
            flex-grow: 4;
            flex-shrink: 4;
        }
        div#c{
            flex-basis:150px ;
            flex-grow: 4;
            flex-shrink: 4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="a">A</div>
        <div class="item" id="b">B</div>
        <div class="item" id="c">C</div>
    </div>
</body>
</html>
