<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="circle">
            <div class="login-box">
                <h2>Login</h2>
                <form>
                    <label for="iEmail">Email</label>
                    <input type="email" name="email" id="iEmail" placeholder="Email" required>
                    <label for="ipass">Password</label>
                    <input type="password" name="password" id="ipass" placeholder="password" required>
                    <a href="#" class="forgot">Esqueceu sua palavra pass?</a>
                    <button type="submit">Login</button>
                    <a href="#" class="signup">Signup</a>
                </form>
            </div>
        </div>
    </div>

<script src="script.js"></script>    
</body>
</html>
